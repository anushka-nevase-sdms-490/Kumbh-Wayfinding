services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: setu
      POSTGRES_PASSWORD: setu
      POSTGRES_DB: setu
    ports:
      - "5432:5432"
    volumes:
      - setu_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U setu -d setu"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: setu
      MINIO_ROOT_PASSWORD: setusecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - setu_minio:/data

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg2://setu:setu@db:5432/setu
      USE_SQLITE: "0"
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: setu
      S3_SECRET_KEY: setusecret
      S3_BUCKET: setu-audits
      JWT_SECRET: change-me-in-production
      CORS_ORIGINS: "*"
      PACK_DIR: /data/packs
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - ./backend/data:/data

volumes:
  setu_pg:
  setu_minio:
